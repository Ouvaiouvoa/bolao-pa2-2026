# Local/production-like stack: Postgres, Redis, MinIO (S3), web, worker.
# Secrets come from an .env file / secret store — never commit real values.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cmf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmf}
      POSTGRES_DB: cmf
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cmf"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cmfminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cmfminio-secret}
    volumes: [minio:/data]
    ports: ["9000:9000", "9001:9001"]
  migrate:
    build: { context: ., dockerfile: infra/docker/Dockerfile }
    command: ["npm", "run", "db:migrate"]
    env_file: [.env]
    environment: &env
      DATABASE_URL: postgres://cmf:${POSTGRES_PASSWORD:-cmf}@postgres:5432/cmf
      REDIS_URL: redis://redis:6379/0
      CMF_STORAGE_DRIVER: s3
      CMF_S3_BUCKET: cmf-media
      CMF_S3_ENDPOINT: http://minio:9000
      CMF_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-cmfminio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-cmfminio-secret}
      CMF_DATA_DIR: /data
      CMF_MODELS_DIR: /models
    depends_on: { postgres: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: infra/docker/Dockerfile }
    command: ["npm", "run", "start:web"]
    env_file: [.env]
    environment: *env
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile }
    command: ["npm", "run", "start:worker"]
    env_file: [.env]
    environment: *env
    volumes: [workerdata:/data, ./.models:/models:ro]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
volumes: { pgdata: {}, minio: {}, workerdata: {} }
